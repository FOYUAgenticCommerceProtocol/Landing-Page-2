:root{color-scheme:light;--pri:#712150;--priH:#5d1a42;--acc:#D9467A;--hi:#F0A23A;--ok:#2F6B3F;--okBg:#E6F0E8;--sand:#F3EDE6;--paper:#FFFDFB;--ink:#2A1424;--body:#4a3342;--muted:#7A6672;--line:#E7DCD3;--warn:#9A5800;--warnBg:#FCEBD2;--tint:#F7EEF2;--unk:#5E5689;--unkBg:#EEEBF8;--grad:linear-gradient(135deg,#712150,#D9467A 55%,#F0A23A)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:8px 12px;z-index:99}.skip:focus{left:12px}
.protobar{background:#1b1b1f;color:#eee;font-size:13px;position:relative;z-index:40}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:#1b1b1f}
.pbin{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:8px}
.pbin .lab{opacity:.75}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid #444;border-radius:999px;overflow:hidden}
.seg button{font:inherit;background:none;color:#ddd;border:0;padding:5px 11px;cursor:pointer;min-height:30px}
.seg button[aria-pressed=true]{background:#fff;color:#111}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hin{display:flex;align-items:center;gap:20px;height:64px}
.wm{width:96px;height:26px;flex:none}
nav.main{display:flex;gap:2px;flex:1;position:relative;align-self:stretch;align-items:center}
.dd{position:static}
.dd>button{font:inherit;font-weight:550;background:none;border:0;color:var(--ink);padding:8px 12px;border-radius:999px;cursor:pointer;min-height:40px}
.dd>button:hover,.dd>button[aria-expanded=true]{background:var(--tint);color:var(--pri)}
.dd>button::after{content:"";display:inline-block;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;rotate:45deg;margin:0 0 3px 8px;transition:rotate .2s}
.dd>button[aria-expanded=true]::after{rotate:225deg;margin-bottom:-1px}
.mega{position:absolute;top:58px;left:0;width:var(--mw,700px);max-width:calc(100vw - 32px);height:var(--mh,auto);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 60px -24px rgba(30,10,25,.35),0 10px 24px -14px rgba(30,10,25,.2);transform:translateX(var(--mx,0px)) translateY(6px) scale(.98);transform-origin:var(--mo,40px) 0;opacity:0;visibility:hidden;overflow:hidden;z-index:35}
.mega.on{opacity:1;visibility:visible;transform:translateX(var(--mx,0px))}
.mega.ready{transition:opacity .2s ease,transform .3s cubic-bezier(.2,.8,.2,1),width .3s cubic-bezier(.2,.8,.2,1),height .3s cubic-bezier(.2,.8,.2,1),visibility .2s}
.caret{position:absolute;top:52px;left:0;width:14px;height:14px;background:#fff;border-left:1px solid var(--line);border-top:1px solid var(--line);rotate:45deg;transform:translateX(var(--cx,0px));opacity:0;visibility:hidden;z-index:36;pointer-events:none}
.caret.on{opacity:1;visibility:visible}
.mega.ready~.caret.ready,.caret.ready{transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s}
.mp{position:absolute;inset:0 auto auto 0;width:var(--pw);padding:10px;opacity:0;visibility:hidden;transition:opacity .18s}
.mp.on{opacity:1;visibility:visible;position:relative}
.mintro{display:flex;justify-content:space-between;gap:16px;align-items:center;background:var(--tint);border-radius:12px;padding:12px 14px;margin-bottom:6px}
.mintro b{font-size:14.5px;color:var(--ink)}.mintro span{font-size:13.5px;color:var(--body);display:block}
.mcols{display:grid;grid-template-columns:repeat(var(--gc,2),minmax(0,1fr));gap:4px 10px}
.mg h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 12px 4px;font-weight:650}
.mg ul{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.mcols.plain{gap:4px 22px}.gh{text-transform:none!important;letter-spacing:0!important;font-size:15px!important;color:var(--ink)!important;font-weight:600!important;margin:10px 12px 8px!important;padding-bottom:10px;border-bottom:1px solid var(--line)}
.gh a{color:inherit;text-decoration:none;display:flex;align-items:center;gap:6px}.gh a::after{content:"→";color:var(--pri);font-size:13px;opacity:.7}.gh a:hover,.gh a:focus-visible{color:var(--pri)}
.dsub .gh{margin:16px 0 4px!important;padding-bottom:8px}.dsub .mi.pl{padding:8px 0}
.mi.pl{display:block;padding:7px 12px}.list .mi.pl>span{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.list .mi.pl span span{display:inline-block;margin:0;font-size:11px;font-weight:650;color:var(--pri);background:var(--tint);border-radius:999px;padding:1px 8px}
.mcols.rule{gap:0}.mcols.rule>.mg{padding:4px 8px 12px}.mcols.rule>.mg+.mg{border-left:1px solid var(--line)}.mcols.tint{gap:0}.mcols.tint>.mg{padding:4px 10px 12px}.mcols.tint>.mg+.mg{border-left:1px solid var(--line)}.mcols.tint>.mg:last-child{background:var(--sand);border-radius:12px;border-left:0}
.mi.pl b{color:var(--pri);font-size:14.5px}.mi.pl span span{font-size:13px}.list .mi.pl{padding:6px 12px}
.mi{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:center;text-decoration:none;padding:9px 12px;border-radius:12px;color:var(--ink)}
.mi:hover,.mi:focus-visible{background:var(--tint)}
.mi:hover .ic,.mi:focus-visible .ic{background:var(--pri);color:#fff}
.mi b{display:block;font-weight:600;font-size:14.5px;line-height:1.25}.mi span{display:block;font-size:13px;color:var(--muted);line-height:1.35;margin-top:2px}
.mi[aria-current=true] b::after{content:"You are here";margin-left:8px;font-size:11px;font-weight:650;color:var(--pri);background:var(--tint);border-radius:999px;padding:1px 7px;vertical-align:1px}

<script>const D={"PROF": {"con": "Consumer", "mer": "Merchant", "par": "Partner", "dev": "Developer"}, "DIRS": {"a": "On your terms", "b": "Hand it off", "c": "Open by design"}, "ST": {"proto": "Designed · prototype only", "pilot": "Pilot design · needs a partner", "later": "Later", "proposed": "Proposed · not live", "draft": "Draft protocol", "policy": "Policy · published before launch", "hyp": "Hypothesis · to be measured", "target": "Target model · not built"}, "PLATFORM": {"reader": "Under the hood", "title": "One platform, four parts, one set of rules", "lede": "People get an agent. Stores get a way to answer agents. Developers get a marketplace. Every purchase, order or data share, from any of them, passes through the same rules layer before it happens.", "parts": [["The app", "A personal shopping agent for discovery, one-off tasks and repeat orders, with a record of everything it did and why.", "proto"], ["The commerce network", "Stores publish offers agents can read: price, stock, delivery and returns. Orders land in the store's own checkout.", "pilot"], ["The agent marketplace", "Specialist agents from developers, listed after evaluation and activated with the permissions each user chooses.", "proto"], ["FOSP, the rules layer", "Checks who is asking, what they are allowed to do and whether the person's limits cover it, for hosted and outside agents alike.", "draft"]], "next": ["Read the questions", "#faq"]}, "FILMS": {"con": ["consumer", "Ask for anything. Your agent shops around.", "Watch one errand from start to finish: a birthday gift for Dad. Your agent searches the stores you use, checks what matters, brings back one great pick and waits for your yes."], "mer": ["merchant", "Agents ask overnight. Your terms decide.", "Watch one night at a small coffee roaster. Requests arrive while the shop is shut; the roaster's published terms answer each one, and the orders that fit land in its own checkout by morning."], "par": ["parmkt", "Two ways in. Your customer stays yours.", "Pick your business: each film shows the embedded path and the hosted path."], "dev": ["devp", "Describe it once. Offer it to everyone.", "A design film. A developer describes an agent, proves it on tricky listings and offers it to shoppers, stores, platforms and other agents. Nothing here is built yet."], "a2a": ["a2a", "An outside agent places an order. Then one is refused.", "A concept film. Lumen, an assistant run by another company, asks to buy headphones for Maya. Follow the checks between its request and the order, then see a request outside her scope refused. Not built."]}, "PAGES": {"con": {"eyebrow": "For Smart Shoppers", "hero": {"a": ["Tell it what you need once. It finds, compares and checks, then comes back with one good answer.", ""], "b": ["Hand off the searching and the restocks. Keep the fun part: choosing.", ""], "c": ["One personal agent across the stores you choose, with specialists when you want them.", ""]}, "hero_alt": "A young woman laughs at her phone; the agent has found a birthday present for her dad, with two other ideas and what it checked.", "cta": ["Join Now", "#form"], "cta2": ["See Your Agent in Action", "#film"], "how": {"reader": "Why it's different", "title": "It works for you, not for a store.", "lede": "It isn't one marketplace's assistant. One request covers the stores you choose, every answer comes with its reasons, and your limits decide what happens without you.", "steps": [["Every store you choose", "One request searches all the stores you allow, so comparing doesn't mean ten open tabs."], ["Reasons with every answer", "Each suggestion says what was checked, and what couldn't be, before you decide."], ["Ranked on fit", "No store will be able to pay to rank higher. The ranking policy will be published before launch."]], "next": ["Join Now", "#form"], "nonum": true}, "mocks": ["C1", "C2", "C3", "C4", "C5", "C6"], "mocks_lede": "Six everyday errands, handed off. Each one saves you time, money or a headache, and you stay in charge.", "faq": [["Will it ever buy something I didn't agree to?", "No. Your agent only acts inside the limits you set: which items, which stores, how much and by when. Anything outside those limits waits for your yes, and if you don't answer, nothing is bought."], ["Who am I buying from?", "The store you pick. You see its name before you say yes, and its prices, delivery terms and return policy apply, just as if you had ordered on its own website."], ["What if something goes wrong with my order?", "Contact the store, as you would today. It handles returns, refunds and delivery problems under its own policy."], ["Who holds my money?", "Not us. We never hold your money or your card number. You pay the store, and your bank or the store's payment provider processes the payment."], ["What happens to my personal details?", "Your agent uses only what each task needs. Your settings decide what may be shared with a store, and when."], ["Can a store pay to be recommended?", "No. Picks are based on fit and on what could be checked, not on who pays. The ranking policy will be published before launch."], ["How do I stop it?", "One switch stops new actions by every agent acting for you. You can also pause a single agent or remove a single limit."], ["Can I use it today?", "Not yet. This page shows a preview with fictional stores and illustrative prices. Join now and we'll invite you when it opens."]], "form": {"style": "signup", "title": "Join Now", "sub": "Log in or create an account", "team": "the team", "fields": [["id", "Mobile number or email", "text"]], "button": "Continue"}, "story": {"reader": "What FOYU Does", "st": "proto", "comp_status": "proto", "title": "It does the legwork.", "close": null, "lede": "Searching, comparing and keeping track are what make shopping online a chore. Hand them to your agent and spend your attention on choosing.", "comps": [["con_verify", "A $89 “was $239” listing it would skip, and the same headphones from an authorised seller, with its reasons.", "SAFE · a doubt resolved before you pay"], ["con_story", "The weekly restock ordered inside an $80 limit; the one price rise waits for a yes.", "FAST · the restock, handled"], ["con_fun", "A specialist agent puts together a hike kit for two inside $300, and says what it couldn't check.", "FUN · a specialist on your side"]], "points": [], "next": ["Watch Your Agent Get It Done", "#mocks"], "title2": ["You keep", "the good part."]}, "h1": ["The Shopping Agent", "on Your Side"], "nosig": false, "skip": ["platform"], "order": ["story", "mocks", "faq", "form"], "rot": [["Dad's birthday is Saturday?", "It finds a grinder he'll love, under $150, there by Friday.", "gift"], ["Down to the last scoop of beans?", "It reorders your usual bag before Monday's coffee.", "coffee"], ["50% off? Really?", "It checks 30 days of prices before you pay.", "sale"], ["Need new running shoes?", "It finds your size in the pair you already love.", "shoes"], ["Price went up overnight?", "It stops and asks. Nothing is ordered without your yes.", "price"]], "mocks_eyb": "Consumer", "onb": ["CO1", "CO2", "CO3", "CO4"], "onb_lede": "Free to start. Three steps, and your card number never leaves your wallet.", "mh": ["Watch Your Agent", "Get It Done"]}, "mer": {"eyebrow": "The Agentic Mini-Store for Brands & Authorized Resellers", "hero": {"a": ["", ""], "b": ["", ""], "c": ["", ""]}, "hero_alt": "A young shop owner cheers at her laptop. Behind her phone, her store control centre lists the night’s requests; the store agent on the phone shows two orders accepted on her published terms, one from a new customer, and a 25% discount request declined. Pop-ups preview a first order from a new customer and a sold-out size where a 1 kg bag is offered only with the shopper’s yes.", "cta": ["Join Now", "#form"], "cta2": ["See Your Store Agent in Action", "#film"], "how": {"reader": "How your store joins", "title": "Publish your terms. Let your rules answer.", "lede": "Connect what you sell, decide what your store may agree to, and let requests that fit become orders in the checkout you already run.", "next": ["Watch Your Agent Get It Done", "#mocks"], "steps": [["Connect your catalogue", "A product feed or your storefront platform: price, stock, delivery and returns, kept in sync."], ["Set the rules", "Price bands, stock held for repeat customers, the substitutions you allow and what always goes to your team."], ["Answer requests", "Requests arrive without personal data. Your merchant agent answers only inside your rules; offers on the network will be signed so terms can't shift."], ["Fulfil as usual", "The order lands in your store with the customer's authority attached. Your checkout, your payment provider, your courier."]]}, "mocks": ["M1", "M2", "M3", "M4", "M5", "M6"], "mocks_lede": "Six moments from an Agentic Mini-Store, for D2C startups and enterprise brands alike.", "faq": [["Who is the seller?", "You are. The order is placed in your store, paid through your own checkout and payment provider, and shipped and serviced under your terms. We never hold the money."], ["Can an agent commit my store to a price or promise I didn't set?", "No. Your store agent only offers what your published terms and rules allow. An order needs both your offer and the customer's authority, and anything outside your rules goes to your team."], ["What does a request tell me, and what stays private?", "A request states the item, the quantity, the limits and the date it's needed. The shopper's personal details are shared only when an order is placed and only what that order needs, such as the delivery address."], ["Can I pay to be recommended or ranked higher?", "No. No store can, including you. Shoppers' agents choose on fit, terms and what they can check. The ranking policy will be published before launch."], ["I'm an authorised reseller. How is that shown?", "The plan is for you to attach the brand's authorisation to your offers, so a shopper's agent can tell an authorised seller from one it couldn't check. The brand confirms it; we don't sell that status."], ["What would my store need to connect?", "For the pilot: a product feed or your storefront platform, your rules, and a way to receive orders. Your checkout, payment provider and courier stay as they are."], ["What if something goes wrong with an order?", "It's handled like any order in your store, under your returns and service policy. Each order carries the terms the customer's agent accepted, so your team has one record to check."], ["Hosted Mini-Store or my own store?", "Either. A hosted Mini-Store is one we would run under your name, for teams without time to build. Embedded keeps your own storefront and systems, and we would run the offer feed, the rules and the store agent beside them. On both, you stay the seller and payment runs through your own checkout."], ["We are an enterprise brand. What would a pilot involve?", "One product line or region, your rules agreed in writing, a security and legal review before anything opens, and named owners on your side. Orders keep the terms the shopper’s agent accepted, so your team can audit them."], ["Is it live?", "Not yet. This page shows a preview with fictional stores and illustrative figures. In our proof of concept, the hand-off from a shopper’s agent to a store’s own checkout worked; everything else here is a pilot design. Join now and we’ll be in touch."]], "form": {"style": "signup", "title": "Join Now", "sub": "Log in or create a store account", "team": "the merchant team", "label": "Work email or mobile number", "ph": "Work email or mobile number", "fine": "We'll use it to save your store's place and contact you about the merchant pilot. The privacy notice and terms will be published before launch.", "ty": "We'll be in touch about the merchant pilot.", "fields": [["id", "Work email or mobile number", "text"]], "button": "Continue"}, "story": {"reader": "What FOYU Does for Merchants", "st": "proto", "comp_status": "proto", "loops": true, "title": "Agents buy what", "lede": "A marketplace sells around the clock too, but inside its store, on its ranking, with its customer. Shoppers’ agents compare sellers everywhere and pick the offer they can check: real price, stock, returns, proof you’re authorised. Your Mini-Store makes your terms checkable, so you win on facts, not ad spend. The customer stays yours.", "comps": [["mer_safe", "A shopper’s agent comparing three sellers can see the brand’s authorisation on your offer, and choose you over a seller it couldn’t check.", "SAFE · proof you’re authorised", "Win new customers"], ["mer_fast", "A regular’s agent reorders straight from your store, not through a marketplace, so the order, the payment and the customer’s history stay with you.", "FAST · reorders come straight to you", "Keep your regulars"], ["mer_fun", "Agents can ask for a deal, a bulk price or a swap. Your rules answer inside the band you set, no store can pay to rank higher, and you stay with the craft.", "FUN · your rules do the haggling", "Protect your margin"]], "points": [], "next": ["How to Build Your Agentic Mini-Store", "#mocks"], "flow": null, "close": null, "tg": "they can check."}, "h1": ["Sell to Shopping Agents,", "on Your Terms"], "skip": ["platform", "how"], "rot": [["New customer, first order?", "A shopper’s agent found your offer and ordered on your terms.", "gift"], ["Regular customer due a refill?", "Their agent reorders from you, on the terms you published.", "coffee"], ["Asked for 25% off?", "Your price band answers. Nothing outside it is offered.", "sale"], ["Authorised by the brand?", "Shoppers' agents can see it on your offer.", "price"], ["Colour sold out?", "Only the swaps you allow are offered, and the shopper says yes first.", "shoes"]], "join": {"ph": "Log in or add your store", "hint": "Work email or mobile number"}, "order": ["story", "mocks", "faq", "form"], "pfilm": true, "hsum": null, "onb": ["MO1", "MO2", "MO3", "MO4", "MO-live-emb", "MO-live-host"], "onb_lede": "Five steps to join a pilot: hosted under your name, or embedded in the store you already run. Once live, people and shoppers’ agents order on the same terms.", "mh": ["How to Build Your", "Agentic Mini-Store"]}, "par": {"eyebrow": "The Agentic Mini-Program for Platforms", "hero": {"a": ["Give your customers a shopping agent inside your app, card or plan. You keep the customer.", ""], "b": ["Your customers will delegate shopping. Be where it starts.", ""], "c": ["One rules layer, offered under your brand.", ""]}, "hero_alt": "Two colleagues, a woman in an olive shirt and a bearded man with a tablet, plan a partner launch. Beside them, the fictional marketplace brightcart shows the agent inside its own app, and a partner console lists where the agent works: in the brightcart app (embedded) and in a hosted Mini-Program with seller Mini-Stores and creator pages. Pop-ups confirm an item added to the brightcart basket and an agent page published.", "cta": ["Talk to Partnerships", "#form"], "cta2": ["See Your Agent in Action", "#film"], "how": {"reader": "How a partnership works", "title": "Pick the model, agree the split, measure on your numbers.", "lede": "Every pilot starts with a written allocation of who holds the customer, the checkout, the payment, the data and the support, then a fixed cohort and a decision date.", "next": ["Watch Your Agent Get It Done", "#mocks"], "steps": [["Choose the model", "An agent in your app, limits on your cards, a channel for your merchants, or guides readers can act on."], ["Write down the split", "Customer relationship, checkout, payment, data and support, per the table above, agreed before anything ships."], ["Integrate and launch to a cohort", "An embedded agent, card controls or a content link, offered to a defined group of your customers."], ["Decide on evidence", "Your metrics against your own benchmark, then continue, change or stop."]]}, "mocks": ["S-mkt-1-emb", "S-mkt-2-emb", "S-mkt-3-emb", "S-mkt-4-emb", "S-mkt-5-emb"], "mocks_lede": "Five use cases for each type of business. Embedded: our agent infrastructure inside your marketplace or store. Hosted: your Mini-Program on our platform, with our infrastructure and distribution.", "faq": [["What do partners get?", "A shopping agent your customers can use under your brand, so the relationship stays with you as shopping moves to agents. You choose where it appears and which commerce it serves. Revenue terms are agreed per pilot; nothing is priced yet."], ["What is the difference between Embedded and Hosted?", "Embedded puts the agent inside a product you already run, such as your app, card controls, plan or booking. Your team integrates it; we run the agent and its checks. Hosted is a Mini-Program under your brand that we build, host and run. It holds Mini-Stores for your sellers, merchants or partner stores. You can start with either and add the other."], ["Who keeps the customer, the checkout and the payment?", "You keep the customer. Stores stay the seller and run their own checkout, unless your own checkout is agreed, as on a marketplace. Payment runs through the customer’s bank, card or provider, or your bill where you offer that. We never hold money."], ["What do we need to provide?", "For Embedded: one surface in your product, access to the catalogue or offers the agent reads, and your checkout or payment hand-off. For Hosted: your brand approval and the sellers or stores you choose. Both need a named owner and first-line support for your customers."], ["What happens to customer data?", "Data use, retention and sharing are written into each pilot agreement before anything starts. The agent uses only what a task needs, and nothing goes beyond what the agreement allows."], ["How are risks controlled?", "Customers set limits, and anything outside them comes back for a yes. Commercial links are labelled, and no one can pay to rank. Each pilot runs with a small group and a stop date, and either side can pause it."], ["How is success measured?", "On your numbers, agreed before launch: for example asks, baskets, orders, returns and support contacts, against your own benchmark. At the end of the pilot you continue, change or stop."], ["What exists today?", "In our proof of concept, the hand-off from the agent to a store’s checkout worked. The embedded agent, Mini-Programs, limits at authorisation and telco billing are pilot concepts, not built. No partner has signed."], ["What are the next steps?", "A first call to pick one profile, one path and one moment, then a written pilot plan covering who does what, data, measures and a decision date."]], "form": {"style": "signup", "title": "Talk to Partnerships", "sub": "Tell us where your customers shop. We’ll reply about a pilot.", "team": "partnerships", "label": "Work email", "ph": "Work email", "fine": "We’ll use it to contact you about a partner pilot. The privacy notice and terms will be published before launch.", "ty": "We’ll be in touch about a partner pilot.", "fields": [["id", "Work email", "email"]], "button": "Continue"}, "story": {"reader": "What FOYU Does for Partners", "st": null, "comp_status": null, "loops": true, "title": "Where the agent lives,", "tg": "the customer stays.", "lede": "Customers will hand routine shopping to agents. Whoever hosts that agent keeps the customer. Embed ours in your product, or launch a Mini-Program on our hosted platform.", "comps": [["par_safe", "Customers set the limits. Anything outside them comes back for a yes, and no one can pay to rank.", "SAFE · limits your customers set", "Give customers control"], ["par_fast", "Embed the agent where your customers already are, or launch a Mini-Program under your brand with nothing to build.", "FAST · embedded or a Mini-Program", "Turn intent into orders"], ["par_fun", "Asking feels like a chat, with the reasons shown. The store stays the seller and runs its checkout.", "FUN · your brand, a better ask", "Delight your customers"]], "points": [], "next": ["Build Your Agentic Mini-Program", "#mocks"], "flow": null, "close": null}, "h1": ["Keep Your Customers", "When Agents Shop"], "skip": ["platform", "how"], "hsum": null, "rot": [["Marketplace?", "In your app, or a Mini‑Program for your sellers.", "cart"], ["Social commerce?", "Under your posts, or creator pages in a Mini‑Program.", "social"], ["Fintech?", "Limits in your app, or a Mini‑Program for merchants.", "card"], ["Telco?", "In your app and plan, or partner stores in a Mini‑Program.", "signal"], ["OTA?", "Inside the booking, or a trip-extras Mini‑Program.", "plane"]], "join": {"ph": "Work email", "hint": "Work email"}, "order": ["story", "mocks", "faq", "form"], "pfilm": true, "onb": ["OE1", "NE1"], "onb_lede": "Pick your business, then a startup or enterprise plan, embedded or hosted.", "onb_note": "Illustrative pilot plan, not a confirmed product flow. Terms are agreed per pilot. Nothing here is live.", "plans": null, "films": [["parmkt", "Marketplace", "Embedded next to search, or a Mini-Program with a Mini-Store for each seller."], ["parsoc", "Social Commerce", "Ask under your posts, or creator agent pages in your Mini-Program."], ["parfin", "Fintech", "Limits applied at authorisation, or a Mini-Program for your merchants."], ["partel", "Telco", "The agent beside the plan, or partner stores in your Mini-Program."], ["parota", "OTA", "The agent inside the booking, or a trip-extras Mini-Program."]], "mh": ["Build Your", "Agentic Mini-Program"], "plans2": {"mkt": {"use": {"emb": ["S-mkt-1-emb", "S-mkt-2-emb", "S-mkt-3-emb", "S-mkt-4-emb", "S-mkt-5-emb"], "host": ["S-mkt-1-host", "S-mkt-2-host", "S-mkt-3-host", "S-mkt-4-host", "S-mkt-5-host"]}, "onb": {"emb": ["OE1", "NE1"], "host": ["OH1", "NH1"]}}, "soc": {"use": {"emb": ["S-soc-1-emb", "S-soc-2-emb", "S-soc-3-emb", "S-soc-4-emb", "S-soc-5-emb"], "host": ["S-soc-1-host", "S-soc-2-host", "S-soc-3-host", "S-soc-4-host", "S-soc-5-host"]}, "onb": {"emb": ["OE2", "NE2"], "host": ["OH2", "NH2"]}}, "fin": {"use": {"emb": ["S-fin-1-emb", "S-fin-2-emb", "S-fin-3-emb", "S-fin-4-emb", "S-fin-5-emb"], "host": ["S-fin-1-host", "S-fin-2-host", "S-fin-3-host", "S-fin-4-host", "S-fin-5-host"]}, "onb": {"emb": ["OE3", "NE3"], "host": ["OH3", "NH3"]}}, "tel": {"use": {"emb": ["S-tel-1-emb", "S-tel-2-emb", "S-tel-3-emb", "S-tel-4-emb", "S-tel-5-emb"], "host": ["S-tel-1-host", "S-tel-2-host", "S-tel-3-host", "S-tel-4-host", "S-tel-5-host"]}, "onb": {"emb": ["OE4", "NE4"], "host": ["OH4", "NH4"]}}, "ota": {"use": {"emb": ["S-ota-1-emb", "S-ota-2-emb", "S-ota-3-emb", "S-ota-4-emb", "S-ota-5-emb"], "host": ["S-ota-1-host", "S-ota-2-host", "S-ota-3-host", "S-ota-4-host", "S-ota-5-host"]}, "onb": {"emb": ["OE5", "NE5"], "host": ["OH5", "NH5"]}}}, "pk": ["mkt", "soc", "fin", "tel", "ota"], "ptabs": ["Marketplace", "Social Commerce", "Fintech", "Telco", "OTA"], "mh_ink": true}, "dev": {"eyebrow": "Build for Shoppers, Stores, Platforms & Agents", "hero": {"a": ["", ""], "b": ["", ""], "c": ["", ""]}, "hero_alt": "A smiling developer in headphones checks his phone. It previews his fictional Restock Planner agent in a test run, as a shopper would see it: pods and coffee for $56, inside a $60 limit, waiting for approval, with no order placed. Behind him a developer console lists where the agent could be offered and the tests it passed. Illustrative design, not built.", "cta": ["Register technical interest", "#form"], "cta2": ["See Your Agent in Action", "#film"], "how": {"reader": "Two tracks", "title": "On our platform, or with agents built anywhere.", "lede": "Both tracks use the same rules: a person’s limits decide what an agent may do, and stores stay the seller. Everything below is in design.", "next": ["See Your Agentic Dev Solution in Action", "#mocks"], "nonum": true, "steps": [["Track 1 · Agents on our platform", "A specialist agent, such as a restock planner or a gift finder, offered to consumers, merchants or partners inside our app and partner surfaces. You declare it, we test it, users switch it on."], ["Track 2 · Solutions for any agent", "Tools that help agents built elsewhere work with our commerce network, such as offer feeds for Mini-Stores or quote checks for merchants. Connections follow the Agent-to-Agent model."], ["Same rules for both", "Listing never lets an agent spend. Every order still needs a person’s limits at the moment it runs, and no one can pay for ranking."]], "also_title": "What is real today, and what is not", "also": [["Available now", "Nothing public. In our proof of concept, the hand-off from an agent to a store’s checkout worked."], ["In design", "The manifest, the test suites, the listing and the runtime checks shown on this page."], ["Proposed", "A fee per successful task, set by you and shown to users first."], ["Not offered", "No API, SDK, documentation, sandbox, protocol support or developer payments yet."]]}, "mocks": ["DV1", "DV2", "DV3", "DV4", "DV5", "DV6"], "mocks_lede": "An Agentic Commerce Development and Deployment Platform. Plug and play: build, test and deploy agents for consumers, merchants and partners, then earn from usage. Or build builder agents that help them create their own.", "faq": [["What can I build?", "Two kinds of thing, once the programme opens: specialist agents that run on our platform for consumers, merchants or partners, and solutions that help agents built elsewhere work with our commerce network."], ["Is there an MCP server, API, SDK or sandbox today?", "No. MCPs, APIs, SDKs and Sandboxing are planned and will be published when they exist. Registering interest puts you in line to help shape them."], ["Does listing let my agent spend money?", "No. Listing would mean it passed our tests. Every purchase still needs the person’s limits at the moment it runs, and the payment provider authorises it."], ["How would agents be ranked?", "By fit to the task and test results, never by payment or ad spend. The policy will be published before launch."], ["How would I earn?", "Proposed: a fee per successful task, set by you and shown to users before they switch your agent on. Nothing is offered today; terms will be set with design partners."], ["Which agent protocols do you support?", "None yet. Supported protocols will be published when they exist."]], "form": {"title": "Register technical interest.", "sub": "Tell us what your agent does and who it's for.", "team": "the developer team", "fields": [["email", "Work email", "email"], ["what", "What you build", "text"], ["kind", "What would your agent do?", "cards", [["For shoppers", [["Restock and repeat orders", "Keeps essentials stocked within a monthly cap"], ["Gift finder", "Shortlists and asks before buying"], ["Price watch", "Holds for a yes when the price moves"]]], ["For stores", [["Reorder agent", "Serves a store’s regular customers"], ["Discount-request answerer", "Replies inside the store’s price band"], ["Catalogue-to-offer converter", "Makes a Mini-Store readable to agents"]]], ["For platforms", [["Partner-surface agent", "Trip extras, plan add-ons, inside a Mini-Program"]]], ["For other agents", [["Quote check", "Prices and holds, within each person’s scope"], ["Offer feed or order status", "Tools other agents call directly"]]]]]], "button": "Register technical interest"}, "story": {"reader": "What FOYU Does for Developers", "st": null, "comp_status": null, "loops": true, "title": "Build it once,", "tg": "reach every side.", "lede": "Commerce agents will come from us and from independent developers, serving shoppers, stores and platforms. Describe your agent once, prove it on tricky cases in a sandbox, then deploy it where people and stores can switch it on.", "comps": [["dev_test", "Run it against changed prices, swapped pack sizes and hidden text in listings before anyone relies on it.", "SAFE · tested before anyone relies on it", "Prove it works"], ["dev_build", "Declare what your agent does, the data it needs and the actions that need a person’s limits, once, in machine-readable f  "pro", "w": 760, "h": 640}, "dev_hero": {"person": "D1", "alt": "A young developer works at his laptop; his console shows the restock agent’s manifest and evaluation suites, and the phone shows a shopper switching it on with exactly those permissions.", "kind": "pro", "w": 760, "h": 640}, "dev_story": {"person": "C4", "alt": "A young man smiles at his phone; the app shows what the runtime allowed, held and blocked for his restock agent, and the developer’s runtime log records the same three decisions.", "kind": "pro", "w": 760, "h": 640}, "a2a_hero": {"person": "D2m", "alt": "A developer works at his desk; the phone shows the outside assistant he connected, the scope granted to it, the order it placed inside that scope and two requests that were refused.", "kind": "solo", "w": 760, "h": 640}, "a2a_story": {"person": "D2", "alt": "A developer at his desk; the phone asks the person to allow an outside assistant one bounded task, with what it may do and what it can never see.", "kind": "solo", "w": 760, "h": 640}, "con_fun": {"person": "S3", "alt": "A laughing couple compare their phones; a specialist agent they switched on has put together a hike kit for two inside their $300, with what it checked and what it couldn’t.", "kind": "solo", "w": 760, "h": 640}, "mer_safe": {"person": "W2", "alt": "A smiling man at his desk checks his phone; his store agent shows a new customer whose agent compared three sellers of the same grinder and chose his offer because the brand’s authorisation was attached, while an $89 seller couldn’t be checked.", "kind": "solo", "w": 760, "h": 640}, "mer_fast": {"person": "W3", "alt": "A young woman at her laptop smiles at her phone; her store agent shows four orders taken overnight on her terms, three from regulars, including a weekly coffee refill paid in her own checkout.", "kind": "solo", "w": 760, "h": 640}, "mer_fun": {"person": "W4", "alt": "A florist in an apron laughs at his tablet in his flower shop; his store agent accepted a Friday function lpE(s){return esc(s==null?'':String(s))}
/* timing: a running clock, every element gets data-t */
function LPT(t0){this.t=t0}
LPT.prototype.at=function(d){const a=this.t;this.t+=d;return `data-t="${a.toFixed(2)}"`};
function lpPhoneItems(items,T){let h='';items.forEach((it,j)=>{const ty=it[0];
 if(ty==='ag'&&j){h+=`<div class="bub ag lty" data-t="${T.t.toFixed(2)}" data-u="${(T.t+.85).toFixed(2)}" aria-hidden="true"><i></i><i></i><i></i></div>`;T.t+=.85}
 switch(ty){

 case 'mp':h+=`<div class="card lmp" ${T.at(1.1)}><div class="ava biz" style="background:${it[2]}"><span>${lpE(it[1])}</span></div><div class="g"><b>${lpE(it[3])}</b><span>${lpE(it[4])}</span></div><span class="pill dark">Open</span></div>`;break;
