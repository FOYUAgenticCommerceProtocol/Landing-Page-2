<!doctype html>

<script>
/* Addresses are lowercase. /MERCHANTS/FAQ or /Merchants/Agentic-Mini-Store forward to the lowercase address. */
(function(){var p=location.pathname,l=p.toLowerCase().replace(/\/+$/,"")||"/";if(l!==p)location.replace(l+location.search+location.hash)})();
</script>
<title>Page Not Found · Agentic Commerce</title>
<meta name="robots" content="noindex">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{--pri:#004466;--priH:#003552;--ink:#0F2A3A;--body:#34505F;--line:#DCE2E4;--paper:#FFFEFC;--grad:linear-gradient(135deg,#004466 0%,#8A67C2 55%,#F2925C 100%)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:17px/1.55 "Instrument Sans",system-ui,sans-serif;padding:24px}
main{max-width:560px;text-align:center}
.wm{display:block;margin:0 auto 32px;width:108px;height:30px;background:var(--pri);-webkit-mask:url(/brand/wordmark_Harbour.png) center/contain no-repeat;mask:url(/brand/wordmark_Harbour.png) center/contain no-repeat}
h1{font-size:40px;line-height:1.1;letter-spacing:-.02em;margin:0 0 12px;font-weight:680}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--body);margin:0 0 26px}
nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;text-decoration:none;font-weight:600;color:var(--pri);box-shadow:inset 0 0 0 1.5px var(--pri)}
a.pri{background:var(--pri);color:#fff;box-shadow:none}
a:hover{background:#ECF3F6}a.pri:hover{background:var(--priH)}
</style>
</head>
