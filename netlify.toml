# Static site: no build step. Netlify serves the repository root as-is.
[build]
  publish = "."
  command = ""

# Pages: always revalidate so a new push shows up straight away.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Media: cache for a day in browsers and at the edge.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Caption files must be served as WebVTT or browsers ignore them.
[[headers]]
  for = "/media/film/*.vtt"
  [headers.values]
    Content-Type = "text/vtt; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/merchants.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/partners.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/developers.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# PoC surfaces and APIs run on Vercel (repo FOYU_POC_Q4_2026, surfaces/web) and are served under foyu.ai.
# These proxies come first so they win over the persona rules below. Status 200 keeps foyu.ai in the address bar.
# FOYU for assistants (MCP): OAuth metadata that Claude and other assistants read before connecting to
# foyu.ai/api/mcp. Served by the PoC on Vercel, like /api/*.
[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "https://foyu-poc-web.vercel.app/.well-known/oauth-protected-resource/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "https://foyu-poc-web.vercel.app/.well-known/oauth-protected-resource"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "https://foyu-poc-web.vercel.app/.well-known/oauth-authorization-server"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server/*"
  to = "https://foyu-poc-web.vercel.app/.well-known/oauth-authorization-server/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/openid-configuration"
  to = "https://foyu-poc-web.vercel.app/.well-known/openid-configuration"
  status = 200
  force = true

[[redirects]]
  from = "/app/*"
  to = "https://foyu-poc-web.vercel.app/app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/merchants/app/*"
  to = "https://foyu-poc-web.vercel.app/merchants/app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/partners/app/*"
  to = "https://foyu-poc-web.vercel.app/partners/app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/developers/app/*"
  to = "https://foyu-poc-web.vercel.app/developers/app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/assets/*"
  to = "https://foyu-poc-web.vercel.app/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://foyu-poc-web.vercel.app/api/:splat"
  status = 200
  force = true

