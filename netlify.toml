# Static site: no build step. Netlify serves the repository root as-is.
[build]
  publish = "."
  command = ""

# Pages: always revalidate so a new push shows up straight away.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Media: cache for a day in browsers and at the edge.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Caption files must be served as WebVTT or browsers ignore them.
[[headers]]
  for = "/media/film/*.vtt"
  [headers.values]
    Content-Type = "text/vtt; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/merchants.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/partners.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/developers.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# iPhone app passkeys: tells iOS that the FOYU app (Team 5HK7S28T9A, bundle ai.foyu.app) may use foyu.ai passkeys.
# A static file in this repo, kept apart from the /.well-known/oauth-* proxies below. Apple requires application/json.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# PoC surfaces and APIs run on Vercel (repo FOYU_POC_Q4_2026, surfaces/web) and are served under foyu.ai.
# These proxies come first so they win over the persona rules below. Status 200 keeps foyu.ai in the address bar.
# FOYU for assistants (MCP): the four MCP servers (foyu.ai/mcp, /merchants/mcp, /partners/mcp, /developers/mcp)
# and the OAuth metadata assistants read before connecting. Served by the PoC on Vercel, like /api/*.
[[redirects]]
  from = "/mcp"
  to = "https://foyu-poc-web.vercel.app/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/merchants/mcp"
  to = "https://foyu-poc-web.vercel.app/merchants/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/partners/mcp"
  to = "https://foyu-poc-web.vercel.app/partners/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/developers/mcp"
  to = "https://foyu-poc-web.vercel.app/developers/mcp"
  status = 200
  force = true

