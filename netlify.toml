# Static site: no build step. Netlify serves the repository root as-is.
[build]
  publish = "."
  command = ""

# Pages: always revalidate so a new push shows up straight away.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Media: cache for a day in browsers and at the edge.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Caption files must be served as WebVTT or browsers ignore them.
[[headers]]
  for = "/media/film/*.vtt"
  [headers.values]
    Content-Type = "text/vtt; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/merchants.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/partners.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/developers.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# PoC surfaces and APIs run on Vercel (repo FOYU_POC_Q4_2026, surfaces/web) and are served under foyu.ai.
# These proxies come first so they win over the persona rules below. Status 200 keeps foyu.ai in the address bar.
[[redirects]]
  from = "/app/*"
  to = "https://foyu-poc-web.vercel.app/app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/merchants/app/*"
  to = "https://foyu-poc-web.vercel.app/merchants/app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/partners/app/*"
  to = "https://foyu-poc-web.vercel.app/partners/app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/developers/app/*"
  to = "https://foyu-poc-web.vercel.app/developers/app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/assets/*"
  to = "https://foyu-poc-web.vercel.app/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://foyu-poc-web.vercel.app/api/:splat"
  status = 200
  force = true

# Persona web addresses: each serves the one-page site, which opens that persona's hero.
[[redirects]]
  from = "/merchants"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/partners"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/developers"
  to = "/index.html"
  status = 200

# Singular spellings and campaign shortcuts forward to the main addresses.
[[redirects]]
  from = "/merchant"
  to = "/merchants"
  status = 301

[[redirects]]
  from = "/partner"
  to = "/partners"
  status = 301

[[redirects]]
  from = "/developer"
  to = "/developers"
  status = 301

[[redirects]]
  from = "/consumer"
  to = "/"
  status = 301

[[redirects]]
  from = "/consumers"
  to = "/"
  status = 301

[[redirects]]
  from = "/sell"
  to = "/merchants"
  status = 301

[[redirects]]
  from = "/build"
  to = "/developers"
  status = 301
